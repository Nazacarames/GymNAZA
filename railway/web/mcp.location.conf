    # GymNAZA: conector MCP para Claude. /mcp/<secreto> → api:${MCP_PORT}. La clave la valida la
    # api; nginx solo reenvía. Sin access_log porque la URL contiene la clave.
    location ^~ /mcp/ {
        access_log off;
        client_max_body_size 1m;
        resolver ${RESOLVER} valid=10s;
        set $mcp_upstream http://${BACKEND}:${MCP_PORT};
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    # Sin esto, el 302 a "/" del bloque de abajo haría creer a Claude que hay un OAuth que no existe.
    location ^~ /.well-known/oauth { return 404; }

